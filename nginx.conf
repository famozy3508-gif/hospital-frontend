# frontend/nginx.conf
# ทำหน้าที่เดียวกับ vercel.json (rewrite ทุก path ไปที่ index.html)
# เพื่อให้ React Router (client-side routing) ทำงานได้ตอน refresh หน้า/เข้าตรง path ย่อย

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
